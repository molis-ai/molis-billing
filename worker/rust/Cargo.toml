[package]
name = "molis-billing-worker"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["mock-payment"]
mock-payment = ["dep:hmac"]
test-fixture = []

[dependencies]
futures-util = {version="0.3", default-features=false}
js-sys = "0.3"
hmac = { version = "0.12", optional = true }
sha2 = "0.10"
subtle = "2"
worker = { version = "=0.8.6", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# wasm-bindgen needs the externref table metadata.
strip = "debuginfo"
